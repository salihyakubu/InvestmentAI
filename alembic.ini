[alembic]
script_location = alembic
# Add the project root to sys.path so env.py and migrations can import
# `core`/`config` (needed for `alembic upgrade head` locally and on deploy).
prepend_sys_path = .
# Overridden at runtime by env.py from application settings; kept as a fallback.
sqlalchemy.url = postgresql+asyncpg://investai:investai@localhost:5432/investai

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
