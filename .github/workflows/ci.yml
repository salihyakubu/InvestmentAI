name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff>=0.3.0"
      - name: ruff check
        run: ruff check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # OpenMP runtime for xgboost / lightgbm native libraries.
      - run: sudo apt-get update && sudo apt-get install -y libgomp1
      - run: pip install -e ".[dev]"
      - name: pytest
        run: pytest -q
        env:
          PYTHONPATH: ${{ github.workspace }}

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    # mypy --strict is clean (0 errors) and now a blocking gate: keep it that way.
    # mypy is pinned (pyproject dev deps) so a future release can't drift CI red.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: mypy
        run: mypy config core services api
