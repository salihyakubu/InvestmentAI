services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    ports:
      - "5450:5432"
    environment:
      POSTGRES_DB: investai
      POSTGRES_USER: investai
      POSTGRES_PASSWORD: investai_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Schema is managed by Alembic (`alembic upgrade head`), not an init script:
    # 0001 creates the ORM tables, 0002 adds TimescaleDB hypertables + retention.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    ports:
      - "8000:8000"
    env_file: .env
    # Point at the compose service names (env_file's .env is developer-local and
    # targets localhost); `environment` overrides env_file in compose.
    environment:
      DATABASE_URL: postgresql+asyncpg://investai:investai_dev@postgres:5432/investai
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - model_artifacts:/app/model_artifacts
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://investai:investai_dev@postgres:5432/investai
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - model_artifacts:/app/model_artifacts
    command: python -m services.worker

  frontend:
    # Production build: Vite bundle served by nginx, which proxies /api (REST +
    # WebSocket) to the api service. For hot-reload local dev run `npm run dev`
    # in ./frontend instead (Vite on :3000 proxies to the API on :8001).
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/Dockerfile.frontend
    ports:
      - "3000:80"
    environment:
      BACKEND_URL: http://api:8000
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  pgdata:
  redisdata:
  model_artifacts:
  grafana_data:
